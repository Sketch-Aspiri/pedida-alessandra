<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3d0d7" />
    <meta name="description" content="Una pregunta especial de Andres para Alessandra." />
    <title>Alessandra — una pregunta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="wash wash-a"></div>
      <div class="wash wash-b"></div>
      <div class="veil"></div>
      <div class="bloom bloom-1"></div>
      <div class="bloom bloom-2"></div>
      <div class="bloom bloom-3"></div>
      <canvas id="petals" class="petals"></canvas>
    </div>

    <main class="stage">
      <section class="hero" id="ask" data-view="ask" aria-live="polite">
        <p class="asker" id="asker">Andres pregunta…</p>
        <h1 class="brand">Alessandra</h1>

        <div class="progress" id="progress" aria-hidden="true"></div>

        <p class="question" id="question"></p>
        <p class="hint" id="hint"></p>

        <div class="actions" id="actions">
          <button type="button" class="btn btn-yes" id="yesBtn">Sí</button>
          <button type="button" class="btn btn-no" id="noBtn" aria-label="No">No</button>
        </div>
      </section>

      <section class="hero success" id="success" data-view="success" hidden>
        <p class="asker success-kicker">Entonces es oficial</p>
        <h1 class="brand success-brand">Alessandra</h1>
        <p class="question success-line">
          Gracias por decir que sí.<br />
          Andres está feliz — y un poco nervioso todavía.
        </p>
        <p class="soft-note">Esto es solo el comienzo.</p>
      </section>
    </main>

    <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>
    <script src="./app.js" type="module"></script>
  </body>
</html>
